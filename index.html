<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>결혼 비용 계산기</title>
<style>
:root{--bg:#faf7f0;--card:#fff;--bg2:#efe7d6;--ink:#35332e;--mut:#8a857a;--sg:#7d9a82;--sgd:#587a5f;--rd:#b4503a;--ln:#e6dfce;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#1f2420;--card:#2a302b;--bg2:#343b35;--ink:#ece8dc;--mut:#a39e90;--sg:#8fb095;--sgd:#a9c9ae;--rd:#e08a74;--ln:#3d453e;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden}body{background:var(--bg);color:var(--ink);font:16px/1.5 "Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 60px}h1{font:600 22px/1.3 "Noto Serif KR","Nanum Myeongjo",serif;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.k{font-size:13px;color:var(--mut)}
.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin-bottom:12px}
#sum{position:sticky;top:0;z-index:4;box-shadow:0 4px 10px #0001}.big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sg{color:var(--sgd);font-weight:700}
summary{display:flex;justify-content:space-between;gap:8px;font-weight:700;cursor:pointer;min-height:36px;align-items:center}
.ch{font-size:13px;color:var(--sgd);margin:10px 0 0;font-weight:600}
.r{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--ln)}.r .nm{flex:1;min-width:0;cursor:pointer}
.r input[type=checkbox]{width:26px;height:26px;accent-color:var(--sgd);flex:none}
input,select,textarea{border:1px solid var(--ln);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--ink);font:inherit;min-height:44px;width:100%}
.r input.a{width:96px;text-align:right;flex:none}.sub{display:flex;gap:6px;align-items:center;padding:0 0 8px 34px;font-size:14px}.sub input{width:80px;text-align:right}
.x{border:0;background:none;color:var(--mut);font-size:18px;width:34px;height:44px;flex:none}
button.b{border:1px solid var(--sg);background:var(--sg);color:#fff;border-radius:12px;min-height:46px;padding:0 14px;font-size:16px;width:100%;margin-top:8px}button.b.s{background:none;color:var(--sgd)}button.b.d{background:none;border-color:var(--rd);color:var(--rd)}
.ic{border:1px solid var(--ln);background:var(--card);border-radius:12px;width:44px;height:44px;font-size:20px;color:var(--ink)}
.bar{height:8px;background:var(--bg2);border-radius:8px;overflow:hidden;margin:3px 0 8px}.bar i{display:block;height:100%;background:var(--sg)}
#sh{position:fixed;inset:0;background:#0006;z-index:9;display:none;align-items:flex-end;justify-content:center}#sh.on{display:flex}#sh>div{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
textarea{min-height:100px;font-size:12px}label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}.st{text-align:center;padding-top:12vh}.st p{color:var(--mut)}
</style></head><body><main id="app"></main><div id="sh"><div id="shb"></div></div>
<script>
const RAW=`자유|상견례|상견례 식대*
ASAP|웨딩홀 결정(웨딩 날짜 확정)|대관료;식대*;본식 스냅(1인 기준);본식 아이폰 스냅;dvd;버스 대절
M13|플래너 계약(선택)|스드메 전체 견적
M13|헤어변형 예약(촬영/본식)|헤어 변형비
M13|메이크업 예약|메이크업 비용;컷피스 등 추가금;얼리 스타트 비용
M12|신혼여행 예약|비행기;숙소;현지 사용
M9|본식 드레스 투어|피팅비(3곳);본식 드레스;2부 드레스;악세서리;누브라, 심리스, 웨딩슈즈 등
M9|예복/예물/예단|피팅비;본식 예복;구두;웨딩밴드
M8|혼주 헤어&메이크업 예약|혼주·가족 헤어&메이크업
M8|촬영 드레스 투어|촬영용 드레스;촬영용 수트
M6|스튜디오 촬영|드레스 헬퍼비;원본파일 구매(포함);수정본 파일 구매;촬영 중 간식;사진 보정;추가금
M3|한복/혼주한복|혼주 양복/한복
M3|본식 드레스 셀렉|본식 드레스 셀렉
M3|청첩장 제작|종이 청첩장;모바일 청첩장
M3|웨딩카|웨딩카(or 콘택시)
M2|집 계약|집 계약 비용
M2|혼수|혼수
M2|청첩장 모임|소개팅, 사례비;청첩장 모임비*
M1|본식 준비|사회자;축가;부케&부토니에;본식 DVD 제작;드레스 헬퍼비;네일아트;답례품`;
const U={'만 원':1,'천 원':10,'원':10000},KEY='wb_v3';let uid=0;
const seed=()=>{const o=[];RAW.split('\n').forEach(l=>{const a=l.split('|');a[2].split(';').forEach(n=>{const m=n.endsWith('*');o.push({id:'i'+(++uid),when:a[0],cat:a[1],name:m?n.slice(0,-1):n,amt:0,paid:false,up:0,qty:0,mode:m?'mul':'amt',lab:'명'})})});return o};
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.items)S={wd:'',unit:'만 원',items:seed(),v:'start'};
S.items.forEach(i=>{if(!i.mode)i.mode=(i.qty>0||/식대|청첩장 모임비/.test(i.name))?'mul':'amt';if(!i.lab)i.lab='명'});
uid=S.items.reduce((m,i)=>Math.max(m,+i.id.slice(1)||0),0);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},$=id=>document.getElementById(id);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=v=>(Math.round(v*U[S.unit]*100)/100).toLocaleString('ko-KR'),num=v=>{const n=parseFloat(String(v).replace(/[^0-9.]/g,''));return isNaN(n)||n<0?0:n};
const A=i=>i.mode=='mul'?i.up*i.qty:i.amt,sum=(a,fn)=>a.reduce((s,i)=>s+fn(i),0);
const WS=['자유','ASAP'].concat(Array.from({length:19},(_,k)=>'M'+(18-k)));
const ord=w=>w=='자유'?-2:w=='ASAP'?-1:100-+w.slice(1);
function wl(w){if(w=='자유')return '시기 자유';if(w=='ASAP')return '가장 먼저 (ASAP)';const n=+w.slice(1);if(/^\d{4}-\d\d$/.test(S.wd)){const q=S.wd.split('-').map(Number),d=new Date(q[0],q[1]-1-n,1);return d.getFullYear()+'년 '+(d.getMonth()+1)+'월'+(n?'':' · 결혼식')}return n?'결혼 '+n+'개월 전':'결혼 달'}
function draw(){const y=scrollY;$('app').innerHTML=S.v=='start'?start():S.v=='set'?set():main();if(S.v=='main'){upd()}scrollTo(0,S.v=='main'?y:0)}
function start(){return`<div class="st"><h1>결혼 비용 계산기</h1><p>결혼 예정 월을 알려 주세요.<br>시기별로 준비할 일과 들어가는 비용을 정리해 드려요.</p><input type="month" id="wm" style="font-size:20px;text-align:center"><button class="b" onclick="begin()">시작하기</button><button class="b s" onclick="begin(1)">아직 안 정했어요</button></div>`}
function begin(sk){const v=$('wm').value;if(!sk&&!v)return alert('년도와 월을 선택해 주세요.');S.wd=sk?'-':v;S.v='main';save();draw()}
function main(){const G={};S.items.forEach(i=>(G[i.when]=G[i.when]||[]).push(i));
return`<div class="top"><h1>결혼 비용 계산기</h1><button class="ic" onclick="S.v='set';draw()" aria-label="설정">⚙</button></div>
<div class="c" id="sum"><div class="k">지금까지 입력한 총 비용 (${S.unit})</div><div class="big" id="t0"></div><div class="g2" style="margin-top:6px"><div><div class="k">결제 완료</div><div class="sg" id="t1"></div></div><div><div class="k">아직 낼 돈</div><div style="font-weight:700" id="t2"></div></div></div></div>
<div class="k" style="margin:-4px 2px 10px">항목 오른쪽에 금액을 적고, 결제를 마쳤으면 왼쪽 칸을 체크하세요.</div>
${Object.keys(G).sort((a,b)=>ord(a)-ord(b)).map(w=>{let pc='';return`<details class="c" open><summary><span>${E(wl(w))}</span><span id="g_${w}"></span></summary>${G[w].map(i=>{let h='';if(i.cat!=pc&&i.cat!=i.name)h=`<div class="ch">${E(i.cat)}</div>`;pc=i.cat;return h+row(i)}).join('')}<button class="b s" onclick="ed(null,'${w}')">+ 이 시기에 항목 추가</button></details>`}).join('')}
<div class="c"><b>시기별 비용</b><div id="bars" style="margin-top:6px"></div></div>`}
function row(i){const u=U[S.unit],m=i.mode=='mul';return`<div class="r"><input type="checkbox" ${i.paid?'checked':''} onchange="pd('${i.id}',this.checked)" aria-label="결제 완료"><span class="nm" onclick="ed('${i.id}')">${E(i.name)} <span class="k">✎</span></span>${m?`<b id="t_${i.id}" style="width:96px;text-align:right"></b>`:`<input class="a" inputmode="decimal" placeholder="0" value="${i.amt?+(i.amt*u).toFixed(2):''}" oninput="am('${i.id}',this)">`}</div>${m?`<div class="sub">단가 <input inputmode="decimal" value="${i.up?+(i.up*u).toFixed(2):''}" placeholder="0" oninput="ud('${i.id}','up',this)"> × <input inputmode="numeric" value="${i.qty||''}" placeholder="0" oninput="ud('${i.id}','qty',this)">${E(i.lab||'명')}</div>`:''}`}
const gi=id=>S.items.find(x=>x.id==id);
function am(id,el){el.value=el.value.replace(/[^0-9.]/g,'');gi(id).amt=num(el.value)/U[S.unit];save();upd()}
function ud(id,k,el){el.value=el.value.replace(/[^0-9.]/g,'');const i=gi(id);i[k]=k=='qty'?Math.floor(num(el.value)):num(el.value)/U[S.unit];save();upd()}
function pd(id,v){gi(id).paid=v;save();upd()}
function upd(){const I=S.items,t=sum(I,A),p=sum(I,i=>i.paid?A(i):0);$('t0').textContent=f(t);$('t1').textContent=f(p);$('t2').textContent=f(t-p);const g={};I.forEach(i=>g[i.when]=(g[i.when]||0)+A(i));
I.forEach(i=>{const e=$('t_'+i.id);if(e)e.textContent=f(A(i))});Object.keys(g).forEach(w=>{const e=$('g_'+w);if(e)e.textContent=g[w]?f(g[w]):''});
const ks=Object.keys(g).filter(w=>g[w]>0).sort((a,b)=>ord(a)-ord(b)),mx=Math.max(...ks.map(w=>g[w]),1);$('bars').innerHTML=ks.length?ks.map(w=>`<div class="row" style="display:flex;justify-content:space-between;font-size:14px"><span>${E(wl(w))}</span><span>${f(g[w])}</span></div><div class="bar"><i style="width:${g[w]/mx*100}%"></i></div>`).join(''):'<div class="k">금액을 입력하면 시기별로 얼마가 드는지 보여요.</div>'}
function ed(id,w){const i=id?gi(id):{name:'',when:w,mode:'amt',lab:'명'},mu=i.mode=='mul';$('shb').innerHTML=`<b>${id?'항목 수정':'항목 추가'}</b><label>항목 이름</label><input id="en" value="${E(i.name)}"><label>시기</label><select id="ew">${WS.map(x=>`<option value="${x}" ${x==i.when?'selected':''}>${E(wl(x))}</option>`).join('')}</select><label>금액 입력 방식</label><select id="em" onchange="$('elw').style.display=this.value=='mul'?'':'none'"><option value="amt" ${mu?'':'selected'}>금액만 입력</option><option value="mul" ${mu?'selected':''}>단가 × 수량 (예: 인당 금액 × 인원)</option></select><div id="elw" style="display:${mu?'':'none'}"><label>수량 이름 (예: 명, 개, 박)</label><input id="el" value="${E(i.lab||'명')}" maxlength="6"></div><button class="b" onclick="edOk('${id||''}','${w||''}')">저장</button>${id?`<button class="b d" onclick="rm('${id}')">삭제</button>`:''}<button class="b s" onclick="cl()">취소</button>`;$('sh').classList.add('on')}
function edOk(id){const n=$('en').value.trim();if(!n)return alert('항목 이름을 입력해 주세요.');const m=$('em').value,lab=$('el').value.trim()||'명',wh=$('ew').value;if(id){const i=gi(id);if(i.mode!=m){if(m=='mul'){i.up=i.amt;i.qty=i.amt?1:0}else i.amt=A(i)}Object.assign(i,{name:n,when:wh,mode:m,lab})}else S.items.push({id:'i'+(++uid),when:wh,cat:'직접 추가',name:n,amt:0,paid:false,up:0,qty:0,mode:m,lab});save();cl();draw()}
function rm(id){const i=gi(id);ask(`‘${E(i.name)}’ 항목을 삭제할까요?`,()=>{S.items=S.items.filter(x=>x.id!=id);save();draw()})}
function ask(m,fn){window._fn=fn;$('shb').innerHTML=`<p><b>${m}</b></p><div class="g2"><button class="b s" onclick="cl()">취소</button><button class="b d" onclick="cl();_fn()">확인</button></div>`;$('sh').classList.add('on')}
function cl(){$('sh').classList.remove('on')}$('sh').onclick=e=>{if(e.target.id=='sh')cl()};
function set(){return`<div class="top"><h1>설정</h1><button class="ic" onclick="S.v='main';draw()" aria-label="닫기">✕</button></div>
<div class="c"><label style="margin:0">결혼 예정 월</label><input type="month" value="${/^\d{4}-\d\d$/.test(S.wd)?S.wd:''}" onchange="S.wd=this.value||'-';save()"><label>금액 단위</label><select onchange="S.unit=this.value;save()">${Object.keys(U).map(u=>`<option ${u==S.unit?'selected':''}>${u}</option>`).join('')}</select></div>
<div class="c"><b>엑셀(CSV)로 내보내기·가져오기</b><div class="k">내보내기 후 아래 칸의 내용을 복사해 엑셀에 붙이세요. 금액은 항상 만 원 단위로 저장돼요.</div><textarea id="csv"></textarea><div class="g2"><button class="b" onclick="csvOut()">내보내기</button><button class="b s" onclick="csvIn()">가져오기</button></div></div>
<div class="c"><b>데이터 관리</b><div class="g2"><button class="b s" onclick="bak()">지금 백업</button><button class="b s" onclick="rest()">백업 복원</button></div><button class="b s" onclick="ask('모든 금액과 체크를 지울까요? 항목은 그대로 둬요.',()=>{S.items.forEach(i=>{i.amt=0;i.up=0;i.qty=0;i.paid=false});save();S.v='main';draw()})">금액만 모두 지우기</button><button class="b d" onclick="ask('항목과 금액을 처음 상태로 되돌릴까요?',()=>{S.items=seed();save();S.v='main';draw()})">처음 상태로 되돌리기</button></div>`}
function csvOut(){const q=s=>'"'+String(s).replace(/"/g,'""')+'"';$('csv').value=['시기,분류,항목,금액(만 원),결제완료,인당단가,인원'].concat(S.items.map(i=>[i.when,i.cat,i.name,A(i),i.paid?1:0,i.up,i.qty].map(q).join(','))).join('\n');$('csv').select();try{document.execCommand('copy')}catch(e){}}
function csvIn(){const t=$('csv').value.trim();if(!t)return alert('CSV를 붙여넣어 주세요.');const R=[];let r=[],c='',q=0;for(let k=0;k<t.length;k++){const ch=t[k];if(q){if(ch=='"'&&t[k+1]=='"'){c+='"';k++}else if(ch=='"')q=0;else c+=ch}else if(ch=='"')q=1;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[k+1]=='\n')k++;r.push(c);R.push(r);r=[];c=''}else c+=ch}r.push(c);R.push(r);
const rows=R.slice(1).filter(a=>a.length>=5&&/^(자유|ASAP|M\d+)$/.test(a[0]));if(!rows.length)return alert('읽을 수 있는 행이 없어요. 내보내기한 형식을 써 주세요.');ask(rows.length+'개 항목으로 바꿀까요?',()=>{S.items=rows.map(a=>({id:'i'+(++uid),when:a[0],cat:a[1],name:a[2],amt:num(a[3]),paid:a[4]=='1',up:num(a[5]),qty:Math.floor(num(a[6]))}));S.items.forEach(i=>{i.mode=i.qty>0?'mul':'amt';i.lab='명';if(i.qty>0)i.amt=0});save();S.v='main';draw()})}
function bak(){try{localStorage.setItem(KEY+'_bak',JSON.stringify(S));alert('백업했어요.')}catch(e){alert('백업에 실패했어요.')}}
function rest(){let b;try{b=JSON.parse(localStorage.getItem(KEY+'_bak'))}catch(e){}if(!b)return alert('저장된 백업이 없어요.');ask('백업으로 복원할까요?',()=>{S=b;S.v='main';save();draw()})}
if(S.v!='start'&&!S.wd)S.v='start';if(S.v=='set')S.v='main';draw();
</script></body></html>
